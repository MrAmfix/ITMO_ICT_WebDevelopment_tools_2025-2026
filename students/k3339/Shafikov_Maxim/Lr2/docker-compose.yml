services:
  db:
    image: postgres:16
    container_name: finance_db_lr2
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_lr2:/var/lib/postgresql/data

volumes:
  postgres_data_lr2:
